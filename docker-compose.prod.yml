services:
  pathocore_db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-pathocore_api}
      MYSQL_USER: ${DB_USER:-pathocore}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pathocore_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root}
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - pathocore_db_data:/var/lib/mysql

  keycloak_db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      MYSQL_USER: ${KEYCLOAK_DB_USER:-keycloak}
      MYSQL_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}
      MYSQL_ROOT_PASSWORD: ${KEYCLOAK_DB_ROOT_PASSWORD:-change_me_root}
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - keycloak_db_data:/var/lib/mysql

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    command:
      - start
      - --import-realm
    restart: unless-stopped
    depends_on:
      keycloak_db:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD is required}
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://keycloak_db:3306/${KEYCLOAK_DB_NAME:-keycloak}?useSSL=false&allowPublicKeyRetrieval=true
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?KEYCLOAK_PUBLIC_URL is required}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    expose:
      - "8080"
    ports:
      - "${KEYCLOAK_BIND_HOST:-127.0.0.1}:${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    volumes:
      - ./keycloak/tmp-import:/opt/keycloak/data/import:ro,z

  pathocore_api:
    build:
      context: ../pathocore-api
      args:
        GIT_REVISION: ${PATHOCORE_API_GIT_REVISION:-main}
        INSTALL_CONF: ${PATHOCORE_API_INSTALL_CONF:-conf/docker_production_settings.txt}
    command: ["bash", "/usr/local/bin/pathocore-api-start.sh"]
    restart: unless-stopped
    depends_on:
      pathocore_db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      APP_INSTALL_PATH: /opt/pathocore-api
      APP_REPO_PATH: /srv/pathocore-api
      APP_PORT: 8000
      DB_USER: ${DB_USER:-pathocore}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-pathocore_api}
      DB_HOST: pathocore_db
      DB_PORT: 3306
      LOCAL_SERVER_IP: ${LOCAL_SERVER_IP:-127.0.0.1}
      DNS_URL: ${DNS_URL:?DNS_URL is required}
      PATHOCORE_ENABLE_LEGACY_BASIC_AUTH: ${PATHOCORE_ENABLE_LEGACY_BASIC_AUTH:-false}
      PATHOCORE_ENABLE_PUBLIC_READ_ENDPOINTS: ${PATHOCORE_ENABLE_PUBLIC_READ_ENDPOINTS:-true}
      PUBLIC_API_THROTTLE_RATE: ${PUBLIC_API_THROTTLE_RATE:-500/hour}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      PATHOCORE_CREATE_DEFAULT_SUPERUSER: ${PATHOCORE_CREATE_DEFAULT_SUPERUSER:-false}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?KEYCLOAK_ISSUER is required}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/ciberisciii_datahub/protocol/openid-connect/certs}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?KEYCLOAK_REALM is required}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-pathocore-api}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-pathocore-web}
      KEYCLOAK_JWKS_CACHE_TTL_SECONDS: ${KEYCLOAK_JWKS_CACHE_TTL_SECONDS:-300}
      KEYCLOAK_JWKS_TIMEOUT_SECONDS: ${KEYCLOAK_JWKS_TIMEOUT_SECONDS:-5}
      KEYCLOAK_ADMIN_BASE_URL: ${KEYCLOAK_ADMIN_BASE_URL:?KEYCLOAK_ADMIN_BASE_URL is required}
      KEYCLOAK_ADMIN_TOKEN_REALM: ${KEYCLOAK_ADMIN_TOKEN_REALM:-master}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-admin-cli}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      KEYCLOAK_ADMIN_REQUEST_TIMEOUT_SECONDS: ${KEYCLOAK_ADMIN_REQUEST_TIMEOUT_SECONDS:-10}
      KEYCLOAK_ADMIN_SEND_ACTION_EMAILS: ${KEYCLOAK_ADMIN_SEND_ACTION_EMAILS:-true}
      KEYCLOAK_ADMIN_ACTION_EMAIL_REDIRECT_URI: ${KEYCLOAK_ADMIN_ACTION_EMAIL_REDIRECT_URI:-}
      PATHOCORE_ACCESS_REQUEST_ADMIN_EMAILS: ${PATHOCORE_ACCESS_REQUEST_ADMIN_EMAILS:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@pathocore.local}
      DATABROWSER_CACHE_SCHEDULER_ENABLED: ${DATABROWSER_CACHE_SCHEDULER_ENABLED:-true}
      DATABROWSER_CACHE_REFRESH_WEEKDAY: ${DATABROWSER_CACHE_REFRESH_WEEKDAY:-4}
      DATABROWSER_CACHE_REFRESH_TIME: ${DATABROWSER_CACHE_REFRESH_TIME:-12:00}
      DATABROWSER_CACHE_REFRESH_ON_START: ${DATABROWSER_CACHE_REFRESH_ON_START:-false}
      LOAD_INITIAL_TABLES: ${LOAD_INITIAL_TABLES:-false}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE:-5}
    expose:
      - "8000"
    ports:
      - "${PATHOCORE_API_BIND_HOST:-127.0.0.1}:${PATHOCORE_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    volumes:
      - ./docker/pathocore-api-start.sh:/usr/local/bin/pathocore-api-start.sh:ro,z
      - pathocore_api_documents:/opt/pathocore-api/documents:z
      - ${PATHOCORE_HOST_LOG_DIR:-/var/log/local/pathocore-api/apps}:/opt/pathocore-api/logs:z
      - pathocore_api_static:/opt/pathocore-api/static:z

  mepram_omop_db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MEPRAM_DB_NAME:-mepram_omop_api}
      MYSQL_USER: ${MEPRAM_DB_USER:-mepram}
      MYSQL_PASSWORD: ${MEPRAM_DB_PASSWORD:-mepram_password}
      MYSQL_ROOT_PASSWORD: ${MEPRAM_DB_ROOT_PASSWORD:-change_me_root}
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - mepram_omop_db_data:/var/lib/mysql

  mepram_omop_api:
    build:
      context: ../mepram-omop-api
    command: ["bash", "/usr/local/bin/mepram-omop-api-start.sh"]
    restart: unless-stopped
    depends_on:
      mepram_omop_db:
        condition: service_healthy
    environment:
      APP_INSTALL_PATH: /srv/mepram-omop-api
      MEPRAM_API_DEBUG: ${MEPRAM_API_DEBUG:-false}
      MEPRAM_API_ALLOWED_HOSTS: ${MEPRAM_API_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      MEPRAM_DB_HOST: mepram_omop_db
      MEPRAM_DB_PORT: 3306
      MEPRAM_DB_NAME: ${MEPRAM_DB_NAME:-mepram_omop_api}
      MEPRAM_DB_USER: ${MEPRAM_DB_USER:-mepram}
      MEPRAM_DB_PASSWORD: ${MEPRAM_DB_PASSWORD:-mepram_password}
      MEPRAM_DASHBOARD_SCHEMA: ${MEPRAM_DASHBOARD_SCHEMA:-mepram_omop_api}
      MEPRAM_CORS_ALLOWED_ORIGINS: ${MEPRAM_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      MEPRAM_AUTH_REQUIRED: ${MEPRAM_AUTH_REQUIRED:-false}
      MEPRAM_DOCS_REQUIRE_STAFF: ${MEPRAM_DOCS_REQUIRE_STAFF:-true}
      MEPRAM_CREATE_DEFAULT_SUPERUSER: ${MEPRAM_CREATE_DEFAULT_SUPERUSER:-true}
      DJANGO_SUPERUSER_USERNAME: ${MEPRAM_DJANGO_SUPERUSER_USERNAME:-${DJANGO_SUPERUSER_USERNAME:-admin}}
      DJANGO_SUPERUSER_EMAIL: ${MEPRAM_DJANGO_SUPERUSER_EMAIL:-${DJANGO_SUPERUSER_EMAIL:-admin@example.org}}
      DJANGO_SUPERUSER_PASSWORD: ${MEPRAM_DJANGO_SUPERUSER_PASSWORD:-${DJANGO_SUPERUSER_PASSWORD:-admin_pass}}
      MEPRAM_KEYCLOAK_ISSUER: ${MEPRAM_KEYCLOAK_ISSUER:-}
      MEPRAM_KEYCLOAK_JWKS_URL: ${MEPRAM_KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/ciberisciii_datahub/protocol/openid-connect/certs}
      MEPRAM_KEYCLOAK_AUDIENCE: ${MEPRAM_KEYCLOAK_AUDIENCE:-mepram-api}
      MEPRAM_KEYCLOAK_CLIENT_ID: ${MEPRAM_KEYCLOAK_CLIENT_ID:-pathocore-web}
      MEPRAM_KEYCLOAK_JWKS_CACHE_TTL_SECONDS: ${MEPRAM_KEYCLOAK_JWKS_CACHE_TTL_SECONDS:-300}
      MEPRAM_KEYCLOAK_JWKS_TIMEOUT_SECONDS: ${MEPRAM_KEYCLOAK_JWKS_TIMEOUT_SECONDS:-5}
      PUBLIC_API_THROTTLE_RATE: ${MEPRAM_PUBLIC_API_THROTTLE_RATE:-500/hour}
      GUNICORN_WORKERS: ${MEPRAM_GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${MEPRAM_GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${MEPRAM_GUNICORN_TIMEOUT:-120}
    expose:
      - "8000"
    ports:
      - "${MEPRAM_OMOP_API_BIND_HOST:-127.0.0.1}:${MEPRAM_OMOP_API_PORT:-8100}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5).read()\nPY",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    volumes:
      - ./docker/mepram-omop-api-start.sh:/usr/local/bin/mepram-omop-api-start.sh:ro,z
      - mepram_omop_api_data:/data:z

  pathocore_web:
    build:
      context: .
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-ciberisciii_datahub}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-pathocore-web}
        VITE_USE_CASE_DATA_MODE: ${VITE_USE_CASE_DATA_MODE:-live}
        VITE_USE_CASE_ALERTS_CONTACT_EMAIL: ${VITE_USE_CASE_ALERTS_CONTACT_EMAIL:-}
    restart: unless-stopped
    depends_on:
      pathocore_api:
        condition: service_healthy
      mepram_omop_api:
        condition: service_healthy
    expose:
      - "3000"
    ports:
      - "${PATHOCORE_WEB_BIND_HOST:-127.0.0.1}:${PATHOCORE_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  apache:
    image: registry.access.redhat.com/ubi9/httpd-24:latest
    profiles:
      - apache-container
    restart: unless-stopped
    depends_on:
      pathocore_web:
        condition: service_healthy
      pathocore_api:
        condition: service_healthy
      mepram_omop_api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./docker/httpd/pathocore.conf:/etc/httpd/conf.d/pathocore.conf:ro,z
      - pathocore_api_documents:/var/www/pathocore-api/documents:ro,z
      - pathocore_api_static:/var/www/pathocore-api/static:ro,z

volumes:
  keycloak_db_data:
  pathocore_api_documents:
  pathocore_api_static:
  pathocore_db_data:
  mepram_omop_api_data:
  mepram_omop_db_data:

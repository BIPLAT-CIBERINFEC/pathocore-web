# Apache reverse proxy config for PathoCore services.
#
# Replace placeholders during host installation:
#   __PATHOCORE_DATAHUB_SERVER_NAME__
#   __PATHOCORE_API_SERVER_NAME__
#   __PATHOCORE_KEYCLOAK_SERVER_NAME__
#   __MEPRAM_OMOP_API_SERVER_NAME__
#   __PATHOCORE_FORWARDED_PROTO__
#   __PATHOCORE_FORWARDED_PORT__

<VirtualHost *:80>
    ServerName __PATHOCORE_DATAHUB_SERVER_NAME__

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "__PATHOCORE_FORWARDED_PROTO__"
    RequestHeader set X-Forwarded-Port "__PATHOCORE_FORWARDED_PORT__"
    RequestHeader set X-Forwarded-Host "__PATHOCORE_DATAHUB_SERVER_NAME__"

    LimitRequestBody 52428800
    <IfModule security2_module>
        SecRequestBodyLimit 52428800
        SecRequestBodyNoFilesLimit 52428800
    </IfModule>

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    ProxyTimeout 120
    TimeOut 120

    CustomLog /var/log/local/pathocore-web/apache/pathocore-datahub-apache.access.log combined env=!forwarded
    CustomLog /var/log/local/pathocore-web/apache/pathocore-datahub-apache.access.log proxy env=forwarded
    ErrorLog /var/log/local/pathocore-web/apache/pathocore-datahub-apache.error.log
</VirtualHost>


# Apache reverse proxy config for PathoCore production services.

ServerName ${PATHOCORE_DATAHUB_SERVER_NAME}

<VirtualHost *:8080>
    ServerName ${PATHOCORE_DATAHUB_SERVER_NAME}

    ProxyPreserveHost On
    ProxyRequests Off
    AllowEncodedSlashes NoDecode
    RequestHeader set X-Forwarded-Proto "${PATHOCORE_FORWARDED_PROTO}"
    RequestHeader set X-Forwarded-Port "${PATHOCORE_FORWARDED_PORT}"
    RequestHeader set X-Forwarded-Host "${PATHOCORE_DATAHUB_SERVER_NAME}"

    LimitRequestBody 52428800

    ProxyPass / http://pathocore_web:3000/
    ProxyPassReverse / http://pathocore_web:3000/
    ProxyTimeout 120
    TimeOut 120

    CustomLog logs/pathocore-datahub-apache.access.log combined env=!forwarded
    CustomLog logs/pathocore-datahub-apache.access.log proxy env=forwarded
    ErrorLog logs/pathocore-datahub-apache.error.log
</VirtualHost>

<VirtualHost *:8080>
    ServerName ${PATHOCORE_API_SERVER_NAME}

    ProxyPreserveHost On
    ProxyRequests Off
    AllowEncodedSlashes NoDecode
    RequestHeader set X-Forwarded-Proto "${PATHOCORE_FORWARDED_PROTO}"
    RequestHeader set X-Forwarded-Port "${PATHOCORE_FORWARDED_PORT}"
    RequestHeader set X-Forwarded-Host "${PATHOCORE_API_SERVER_NAME}"

    LimitRequestBody 52428800

    ProxyPass /static/ !
    ProxyPass /documents/ !

    Alias /static/ "/var/www/pathocore-api/static/"
    <Directory "/var/www/pathocore-api/static/">
        Require all granted
    </Directory>

    Alias /documents/ "/var/www/pathocore-api/documents/"
    <Directory "/var/www/pathocore-api/documents/">
        Require all granted
    </Directory>

    ProxyPass / http://pathocore_api:8000/
    ProxyPassReverse / http://pathocore_api:8000/
    ProxyTimeout 120
    TimeOut 120

    CustomLog logs/pathocore-api-apache.access.log combined env=!forwarded
    CustomLog logs/pathocore-api-apache.access.log proxy env=forwarded
    ErrorLog logs/pathocore-api-apache.error.log
</VirtualHost>


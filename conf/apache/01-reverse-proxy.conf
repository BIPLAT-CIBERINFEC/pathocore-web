# Apache routing for the four public PathoCore deployment endpoints.
# The installer renders this source with the protected deployment environment.

<VirtualHost *:8080>
    ServerName ${APACHE_SERVER_NAME}
    ProxyRequests Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode
    RequestHeader set X-Forwarded-Proto "${APACHE_FORWARDED_PROTO}"
    RequestHeader set X-Forwarded-Port "${APACHE_FORWARDED_PORT}"
    RequestHeader set X-Forwarded-Host "${APACHE_SERVER_NAME}"
    LimitRequestBody ${APACHE_LIMIT_REQUEST_BODY}
    <IfModule security2_module>
        SecRequestBodyLimit ${APACHE_LIMIT_REQUEST_BODY}
        SecRequestBodyNoFilesLimit ${APACHE_LIMIT_REQUEST_BODY}
    </IfModule>
    ProxyPass / http://${APACHE_UPSTREAM_SERVICE}:${APACHE_UPSTREAM_PORT}/
    ProxyPassReverse / http://${APACHE_UPSTREAM_SERVICE}:${APACHE_UPSTREAM_PORT}/
    ProxyTimeout ${APACHE_PROXY_TIMEOUT}
    TimeOut ${APACHE_PROXY_TIMEOUT}
    CustomLog logs/${APACHE_LOG_STEM}-apache.access.log combined env=!forwarded
    CustomLog logs/${APACHE_LOG_STEM}-apache.access.log proxy env=forwarded
    ErrorLog logs/${APACHE_LOG_STEM}-apache.error.log
</VirtualHost>

<VirtualHost *:8080>
    ServerName ${APACHE_PATHOCORE_API_SERVER_NAME}
    ProxyRequests Off
    ProxyPreserveHost On
    AllowEncodedSlashes NoDecode
    RequestHeader set X-Forwarded-Proto "${APACHE_PATHOCORE_API_FORWARDED_PROTO}"
    RequestHeader set X-Forwarded-Port "${APACHE_PATHOCORE_API_FORWARDED_PORT}"
    RequestHeader set X-Forwarded-Host "${APACHE_PATHOCORE_API_SERVER_NAME}"
    LimitRequestBody ${APACHE_PATHOCORE_API_LIMIT_REQUEST_BODY}
    <IfModule security2_module>
        SecRequestBodyLimit ${APACHE_PATHOCORE_API_LIMIT_REQUEST_BODY}
        SecRequestBodyNoFilesLimit ${APACHE_PATHOCORE_API_LIMIT_REQUEST_BODY}
    </IfModule>
    ProxyPass /static/ !
    Alias /static/ "${PATHOCORE_API_INSTALL_PATH}/static/"
    <Directory "${PATHOCORE_API_INSTALL_PATH}/static">
        Require all granted
    </Directory>
    ProxyPass /documents/ !
    Alias /documents/ "${PATHOCORE_API_INSTALL_PATH}/documents/"
    <Directory "${PATHOCORE_API_INSTALL_PATH}/documents">
        Require all granted
    </Directory>
    ProxyPass / http://${APACHE_PATHOCORE_API_UPSTREAM_SERVICE}:${APACHE_PATHOCORE_API_UPSTREAM_PORT}/
    ProxyPassReverse / http://${APACHE_PATHOCORE_API_UPSTREAM_SERVICE}:${APACHE_PATHOCORE_API_UPSTREAM_PORT}/
    ProxyTimeout ${APACHE_PATHOCORE_API_PROXY_TIMEOUT}
    TimeOut ${APACHE_PATHOCORE_API_PROXY_TIMEOUT}
    CustomLog logs/${APACHE_PATHOCORE_API_LOG_STEM}-apache.access.log combined env=!forwarded
    CustomLog logs/${APACHE_PATHOCORE_API_LOG_STEM}-apache.access.log proxy env=forwarded
    ErrorLog logs/${APACHE_PATHOCORE_API_LOG_STEM}-apache.error.log
</VirtualHost>


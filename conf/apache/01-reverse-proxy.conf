# The main virtual host above serves PathoCore Web. These public hostnames
# expose the two APIs and Keycloak from the same deployment topology.

<VirtualHost *:8080>
    ServerName ${PATHOCORE_API_SERVER_NAME}

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders Off
    AllowEncodedSlashes NoDecode
    RequestHeader set X-Forwarded-Proto "${APACHE_FORWARDED_PROTO}"
    RequestHeader set X-Forwarded-Port "${APACHE_FORWARDED_PORT}"
    RequestHeader set X-Forwarded-Host "${PATHOCORE_API_SERVER_NAME}"

    LimitRequestBody ${APACHE_LIMIT_REQUEST_BODY}
    <IfModule security2_module>
        SecRequestBodyLimit ${APACHE_LIMIT_REQUEST_BODY}
        SecRequestBodyNoFilesLimit ${APACHE_LIMIT_REQUEST_BODY}
    </IfModule>

    ProxyPass /static/ !
    ProxyPass /documents/ !
    Alias /static/ "${PATHOCORE_API_INSTALL_PATH}/static/"
    <Directory "${PATHOCORE_API_INSTALL_PATH}/static/">
        Require all granted
    </Directory>
    Alias /documents/ "${PATHOCORE_API_INSTALL_PATH}/documents/"
    <Directory "${PATHOCORE_API_INSTALL_PATH}/documents/">
        Require all granted
    </Directory>

    ProxyPass / http://pathocore-api:${PATHOCORE_API_APP_PORT}/
    ProxyPassReverse / http://pathocore-api:${PATHOCORE_API_APP_PORT}/
    ProxyTimeout ${PATHOCORE_API_GUNICORN_TIMEOUT}
    TimeOut ${PATHOCORE_API_GUNICORN_TIMEOUT}

    CustomLog logs/pathocore-api-apache.access.log combined env=!forwarded
    CustomLog logs/pathocore-api-apache.access.log proxy env=forwarded
    ErrorLog logs/pathocore-api-apache.error.log
</VirtualHost>

